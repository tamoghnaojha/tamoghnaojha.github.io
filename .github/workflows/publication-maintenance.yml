name: Publication maintenance

on:
  schedule:
    # GitHub cron has no biweekly primitive. The updater runs weekly, while the
    # epoch-week guard below makes actual checks occur every two weeks.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publication-maintenance
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce fortnightly cadence
        id: cadence
        shell: bash
        run: |
          epoch_week=$(( $(date -u +%s) / 604800 ))
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || $((epoch_week % 2)) -eq 1 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Test publication checker
        if: steps.cadence.outputs.run == 'true'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check authoritative publication metadata
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/update_publications.py --report publication-maintenance-report.md

      - name: Add report to run summary
        if: steps.cadence.outputs.run == 'true'
        run: cat publication-maintenance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient report
        if: steps.cadence.outputs.run == 'true'
        run: rm publication-maintenance-report.md

      - name: Create review pull request
        if: steps.cadence.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/publication-maintenance
          delete-branch: true
          commit-message: "Update verified publication links and BibTeX"
          title: "Update verified publication links and BibTeX"
          body: |
            Automated fortnightly publication metadata check.

            Only high-confidence title, author, and year matches from Crossref
            are included. Please review every DOI before merging.
